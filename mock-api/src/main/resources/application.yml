spring:
  application:
    name: mock-api
  datasource:
    # 파일 모드. 재기동 후에도 등록 기록이 유지되어야 한다(요구사항 5.4 "기록 보존").
    # 시연을 초기화하려면 ./data/mock-api.mv.db 를 지우면 된다.
    url: jdbc:h2:file:./data/mock-api;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8081

# 외부 시스템의 불안정성 재현값. 관리자 API 로 재기동 없이 변경한다(FR-M-05).
mock:
  chaos:
    delay-millis: 500
    failure-rate-percent: 5
